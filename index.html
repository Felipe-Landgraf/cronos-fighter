/*$vite$:1*/
/* CRONOS · acabamento visual. Controles e regras originais preservados. */
:root {
  --gold: #e7c481;
  --teal: #81dcd6;
  --muted: #a5b0c1;
  --border: #d9b87428;
  color: #f2eddf;
  background: #090f1b;
}
body {
  background: radial-gradient(ellipse at 76% 0%, #26344766, transparent 53%), #090f1b;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background: linear-gradient(100deg, #090f1bf7, #090f1be6 47%, #090f1bbd), var(--arena-art) center / cover;
}
#app { position: relative; z-index: 1; }
.site-header { border-color: #e7c48124; padding-top: 24px; padding-bottom: 24px; }
.brand svg { filter: drop-shadow(0 0 12px #e6b75b25); }
.brand > span { color: #f6eedc; }
.brand small { color: #a6b4c9; }
.build-badge { border: 1px solid #d3b77f28; padding: 9px 12px; color: #b7c2d0; font-size: 9px; }
.build-badge i { box-shadow: 0 0 8px #80d5c870; }
.hero { gap: 55px; min-height: 600px; }
.hero h1 { text-shadow: 0 4px 30px #0006; letter-spacing: -.045em; }
.hero h1 em { color: #f1cd88; }
.lede { color: #aab7c8; }
.button {
  border-radius: 3px;
  min-height: 48px;
  background: linear-gradient(115deg, #f3d99e, #d5ac60);
  border: 1px solid #f2d79c;
  color: #111a28;
  letter-spacing: 1px;
  box-shadow: 0 3px 0 #7f6032, 0 8px 24px #0004;
}
.button:not(.ghost) { box-shadow: 0 3px 0 #7f6032, 0 8px 24px #0004; }
.button:hover { background: linear-gradient(115deg, #fff0c7, #edc782); }
.button.ghost { background: #111c2d88; border-color: #b9c6d12e; color: #d1d9e5; box-shadow: none; }
.button.ghost:hover { background: #20304b; border-color: #e7c48177; }
.button:focus-visible, .text-button:focus-visible { outline-color: #f7d799; }
.hero-visual {
  border: 1px solid #d5b67c66;
  border-radius: 8px;
  background: #101b2b;
  box-shadow: 0 30px 80px #0009, 0 0 0 7px #f2d08c05, inset 0 0 0 1px #f2d08c16;
}
.preview-top { background: linear-gradient(90deg, #162136, #0c1626); color: #ccba96; border-radius: 8px 8px 0 0; }
.preview-caption { background: linear-gradient(110deg, #172840, #0c1729); border-top: 1px solid #bfa06b55; border-radius: 0 0 8px 8px; }
.preview-caption strong { font: 600 21px Georgia, serif; text-transform: none; letter-spacing: 0; }

/* CRONOS: seleção arcade em uma única tela. */

}

  width: 100%; height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior: none;
}

body[data-page="select"]::before {
